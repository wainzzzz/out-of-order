╔══════════════════════════════════════════════════════════════════════════════╗
║  電梯逃脫 / ELEVATOR ESCAPE ── 單檔 HTML（Three.js r128）  ·  設計交接版                ║
╚══════════════════════════════════════════════════════════════════════════════╝
【檔案結構（由上到下）】
  ① <style>            CSS：所有 UI 外觀（已換成復古暗黑風：雙層細框、掃描線、點陣網底；可放心改色、字體、材質、動畫）
  ② <body> 的 HTML     UI 骨架：#scene 內含 3D canvas 與各種浮層（ID 不可改名，見下表）
  ③ <script> 區塊 A     遊戲邏輯：道具資料 IT、對話系統、Log、劇情事件 ev*、互動處理器 H、機器 UI
  ④ <script> 區塊 B     Three.js 場景：renderer/燈光/材質、電梯模型、可點擊物件、相機、主迴圈
  搜尋提示：全檔用「【CONTRACT】」標記「改了會壞掉」的地方；用「【VISUAL】」標記「可自由換外觀」的地方。

══════════ 一、UI 元素 ID / CLASS（JS 以 $('id') 直接抓取，改名＝壞掉）══════════
  #g           最外層容器                                #top      遊戲主區（場景＋右欄）
  #scene       3D 場景容器（canvas 被插入為其第一個子節點；所有浮層 absolute 疊在它上面）
  #back        「返回上一個視角」列（zoom 狀態才顯示；JS 切 display）
  #ctl         左下角 7 顆視角按鈕（button[data-c]= l/u/d/r/in/out/h；JS 讀 dataset.c）
  #dlgp        底部對話框外框（JS 加/移除 class：on＝顯示、toast＝短提示小尺寸）
    #who       說話者名稱（JS 設 class：m＝警衛室、p＝玩家、s＝系統，可改顏色）
    #dlog      （已移除：對話紀錄只從右欄「對話紀錄」開啟）
    #txt       對話文字區（打字機逐字填入；class n＝旁白斜體）
    #ch        選項按鈕容器（JS 動態塞 <button data-i="0..">）
    #nx        右下角閃爍 ▼（JS 只切 visibility）
  #logw        LOG 視窗（class on＝顯示；開啟時擋住 3D 點擊）
    #lh / #lx  標題列 / 關閉按鈕      #ll  捲動清單（每行 .le，附 m/p/s/c/n 類別；內含 .lt0 序號、<b> 說話者）
  #modal #mb   「密碼機」彈窗（內容由 machine() 動態產生，見下方 #mc 系列）
  #fl          閃光層（class on 觸發 fl 動畫）          #ov  黑幕/結局文字層（class on＝全黑）
  #side        右側欄
    #about     「持有物品」按鈕（說明文字）            #inv  道具格容器（render() 每次重建）
      .slot    一格；.slot.full＝有道具（可點）；.slot.sel＝選中（呼吸光）；內含 <svg viewBox="0 0 32 32">
               ★ 點擊判定靠 '.slot.full' 與 data-id（＝IT 的 key），不可移除這兩個
    #selname   目前選取的道具名稱
    #lk        「查看道具」按鈕（開 3D 檢視器）        #lg  「對話紀錄」按鈕
  #vm #vb      道具 3D 檢視器（全螢幕彈窗）：#vt 名稱、#vc 放 canvas 的容器、#vdsc 描述、#vx 關閉
  密碼機彈窗內部（machine() 產生）：#mc 外框、#ml 左欄、#dot 電源燈（class g＝亮）、#slot 刷卡槽、
               #mr 右欄、#bx 四格輸入（.lt）、#rg 四個圖示環（.rg）、#rs 重設（如有）、#x 關閉
  class .sk（畫面震動）、.btn（通用按鈕）可自由換樣式。

══════════ 二、可互動 3D 物件（變數名 → 點擊處理器 H[...]）══════════
  點擊流程：cvs.onpointerup → pick() 對 HOT 陣列做 raycast → 讀 mesh.userData
    userData.h = 處理器名稱（H 物件的 key）   userData.g = 所屬 zoom 群組（ZM 的 key，沒有則直接互動）
    userData.f = 「目前可否被點」的過濾函式（依狀態 S）    userData.d/p/fm/k/stuck = 該物件的附加資料
  登記方式只有兩種：tag(mesh,{...}) 把「已存在的可見 mesh」變成可點；hit(w,h,d,x,y,z,{...}) 建「隱形判定盒」。
  ★ 換模型時：新模型不需要可點 → 保留舊的 hit()/tag 對象即可；若要讓新模型本身可點 → 對它呼叫 tag(新mesh,{同樣的 userData})。

  變數名      │ 是什麼                    │ h(handler) │ g(zoom) │ 可點條件 f / 備註
  ───────────┼──────────────────────────┼────────────┼─────────┼──────────────────────────────
  plate      │ 按鈕面板底板（tag）        │ plate      │ panel   │ 點了 → zoom 進面板（ZM.panel）
  BT[] / btn │ 數字按鈕 0-9（tag，共10顆）│ btn        │ panel   │ userData.d＝數字；p＝按下動畫值；fm＝發光材質；stuckBtn＝卡死的那顆(0)
  stuckBtn   │ 卡死按鈕（BT 其一）        │ btn        │ panel   │ 用「車門鑰匙」撬開→露出 hole+ball（S.pried）
  hole / ball│ 按鈕後洞 / 皺紙球（ball tag）│ paper     │ panel   │ f: S.pried && !S.paper
  disp / dp  │ 面板紅色小螢幕（tag）      │ scr        │ scr     │ drawDisp(text,on) 重畫螢幕貼圖
  (mic hit)  │ 對講機隱形判定盒           │ mic        │ panel   │ 無 f
  dL / dR    │ 電梯左右門板（tag）        │ door       │ —       │ 結局才有效：S.ent && !S.over 時 end()；門板位置由主迴圈依 S.exit 滑動
  md         │ 維修暗門「鉸鏈群組」        │ —          │ —       │ 旋轉軸在 md；主迴圈依 S.open 轉 rotation.y
  mdb        │ 維修暗門門板（tag）        │ mdoor      │ mdoor   │ f: !S.open；用 小鑰匙(dkey) 開 → evOpen
  (mach hit) │ 密碼機隱形判定盒           │ mach       │ mdoor   │ f: S.open → machine() 開彈窗；machM 是顯示用貼圖面
  nt         │ 暗門內的真紙條（模型）      │ note       │ mdoor   │ f: S.open && !S.real（判定盒另建）
  post / pg  │ 海報（post tag；pg 是群組） │ poster     │ poster  │ f: !S.pdone；pc(k=1/2) 兩個隱形角落判定盒（左上/右上）撕角
  rail / rr  │ 左/右扶手（railModel）     │ rail       │ —       │ 判定盒 f: !S.rail；撕下後進背包，用於逃生口
  cpm→hatHit │ 天花板逃生口隱形判定盒      │ hatch      │ —       │ 無 f（開著點＝關上；關著＋選扶手＝撬開）
  hatG       │ 逃生口金屬蓋板（群組）      │ —          │ —       │ 純視覺；位置由主迴圈依 hatP（0→1）算：先上抬再側滑
  flapM      │ 地毯可掀翻角（頂點驅動）    │ flap       │ —       │ 判定盒 hit(...,{h:'flap'})；S.lift 切換；peel(p) 每幀重算頂點
  key / (key hit)│ 地毯下小鑰匙           │ key        │ —       │ f: S.lift && !S.dkey && flapP>.8；key.visible 依 flapP>.55
  card       │ 逃生口掉下的警衛證          │ card       │ —       │ f: S.drop && cardSt==2 && !S.card（cardSt：0待命/1掉落中/2落地）
  ZM（zoom表）: panel→[plate,52] scr→[disp,24] poster→[post,44] mdoor→[mdb,30]
               ★ ZM 以「變數名」指向 plate/disp/post/mdb 來決定 zoom 的鏡頭對準點與 fov；換這四個模型時要同步更新 ZM。

══════════ 三、遊戲狀態 S（所有畫面都由 S 推導；新增動畫請讀 S，不要另存狀態）══════════
  S.pow   密碼機通電（刷了警衛證）      S.open  維修暗門已開        S.mdone 密碼機已解（OPEN）
  S.sol   面板已解鎖可輸入樓層          S.code  已輸入的樓層字串     S.ent   6碼輸入完成、可走向電梯門
  S.over  結局演出中                    S.exit  門打開、角色走出     S.shk   震動演出中
  S.pried 按鈕已撬開                    S.paper 已取走血紙條        S.fixed 按鈕已按回原位
  S.scr   螢幕已看過                    S.rev   警衛室身分揭露      S.rail  扶手已撕下（主迴圈讓它飛離牆面）
  S.hat   逃生口蓋板是否開著            S.hatOnce 證件已掉過一次    S.drop  證件已掉出   S.card 證件已拿
  S.lift  地毯角掀起                    S.dkey  已拿小鑰匙          S.real  已拿真紙條
  S.p1 / S.p2 海報左/右上角已撕起        S.pt    海報歪斜量          S.pdone 海報已撕下
  另：busy（劇情演出鎖，true 時「物件互動 H」被忽略；但轉視角、點物件放大、返回、選道具、查看道具、Log 仍可用；演出中點空白處＝下一句）、sel（目前選取的道具 id）、inv（背包陣列）、Z（目前 zoom 群組，null＝自由視角）、
      hist（Log 陣列）、logOpen（LOG 開啟時鎖 3D 點擊）、dMode（對話狀態 0 空閒/1 打字中/2 等點擊/3 選項）

══════════ 四、對話 / 狀態機 API（劇情之後回來改這裡）══════════
  say(說話者,文字) / M(文字)＝警衛室 / P(文字)＝玩家 / N(文字)＝旁白  → 回傳 Promise，玩家點擊後 resolve；自動寫入 hist
  choose([選項...]) → Promise<索引>；note(文字,[標籤]) → 非阻塞短提示（自動消失、也進 Log）
  give(id) 加道具；run(async fn) 包住一段「演出」（自動上鎖 busy、結束解鎖）；H.xxx 是「點到某物件時做什麼」
  事件函式：evPry/evPaper/evScr/evHatch/evHatchClose/evCard/evKey/evOpen/evNote/evPoster/evSolved/machine()/end()
  道具資料 IT = { id:[名稱, 描述, 圖示SVG內容] }；3D 檢視器模型表 MODEL = { id: 產生模型的函式 }（新增道具兩邊都要加）

══════════ 五、改外觀時的鐵則 ══════════
  1. 不要改名：上面表格的 ID、變數名、H 的 key、S 的 key、userData.h/g。
  2. UI 想換皮：只動 CSS；若重寫 HTML，務必保留所有 id 與 .slot/.slot.full/.slot.sel、#dlgp.on/.toast、#logw.on。
  3. 換 3D 模型：保持位置與判定盒大小大致相同；隱形判定盒（hit）與外觀無關，不會因換模型失效。
  4. 3D 渲染：後處理(EffectComposer)失敗會自動退回直接 render；R.localClippingEnabled 用於門板裁切（dClip），別移除。
  5. CDN：three@r128（cdnjs）＋examples（jsDelivr），需連網。
  6. 音效：SFX 模組（Web Audio 合成）＋ sfxTick() 由主迴圈呼叫、比對 S 變化播放；#snd 為靜音鈕。
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ╔═══ 【VISUAL】UI 換皮：復古暗黑獨立遊戲風（雙層細框＋掃描線＋點陣網底）。所有 id / class 名稱維持原樣 ═══╗ */
:root{--amber:#e8dcc0;--red:#d9564a;--line:#5d605e;--line2:#c9cbc6;--txt:#ecebe6;--dim:#8f928f;
 --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--pix:"DotGothic16","Noto Sans TC",ui-monospace,monospace;
 --dither:repeating-conic-gradient(#ffffff06 0 25%,#0000 0 50%) 0 0/4px 4px;
 --scan:repeating-linear-gradient(0deg,#ffffff07 0 1px,#0000 1px 3px);
 --frame:inset 0 0 0 1px #d4d6d1,inset 0 0 0 3px #050505,inset 0 0 0 4px #545755}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#040404;color:var(--txt);font-family:var(--font);user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center;align-items:center;padding-top:env(safe-area-inset-top,0);background:radial-gradient(ellipse at 50% 35%,#141615,#040404 72%)}
button{font-family:var(--font)}
/* ===== 【CONTRACT】佈局骨架：#g 容器 / #top / #scene（3D 容器，勿改 position:relative） ===== */
#g{width:min(100vw - 12px,900px)}
#top{display:flex;overflow:hidden;background:#000;border-radius:2px;box-shadow:0 0 0 1px #000,0 0 0 2px #3c3f3d,0 0 0 5px #0a0b0b,0 0 0 6px #262827,0 18px 50px #000}
#scene{position:relative;flex:1;overflow:hidden;aspect-ratio:4/3;background:#000}
/* 3D 畫面上的暗角＋極淡掃描線 */
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,#0000001c 0 1px,#0000 1px 3px),radial-gradient(ellipse at 50% 46%,#0000 52%,#000a 100%)}
/* ===== 【VISUAL】右側欄 #side（參考圖十：直立網格道具槽＋做舊金屬框） ===== */
#side{width:23%;min-width:112px;display:flex;flex-direction:column;gap:8px;padding:10px 9px;overflow:auto;
 background:var(--dither),linear-gradient(180deg,#151716,#0b0c0c);box-shadow:inset 1px 0 0 #3f4240,inset 2px 0 0 #000,inset 3px 0 0 #2a2c2b,inset 0 0 30px #000}
.sb{position:relative;border:0;border-radius:2px;padding:9px 4px;font-size:12.5px;letter-spacing:.18em;color:#d8d9d4;cursor:pointer;
 background:var(--scan),linear-gradient(#2a2c2b,#141515);box-shadow:inset 0 0 0 1px #8d908b,inset 0 0 0 2px #000,inset 0 0 0 3px #3a3c3b,0 2px 4px #000a;transition:color .15s,box-shadow .15s}
.sb:hover{color:#fff;box-shadow:inset 0 0 0 1px #e9eae5,inset 0 0 0 2px #000,inset 0 0 0 3px #5b5e5c,0 0 10px #ffffff22}
.sb:active{transform:translateY(1px)}
#about{cursor:help;color:#f1ede2;font-size:13px;letter-spacing:.42em;padding:7px 4px;background:var(--scan),linear-gradient(#1e201f,#0f1010);box-shadow:var(--frame)}
#inv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px;background:#0008;box-shadow:inset 0 0 0 1px #3a3d3b,inset 0 0 12px #000}
/* ===== 【VISUAL+CONTRACT】道具格 .slot / .slot.full / .slot.sel；JS 依 .slot.full 與 data-id 判定點擊 ===== */
.slot{position:relative;aspect-ratio:1;border-radius:1px;display:flex;align-items:center;justify-content:center;
 background:var(--dither),linear-gradient(160deg,#2b2e2d,#161818 60%,#1d201f);
 box-shadow:inset 0 0 0 1px #767a77,inset 0 0 0 2px #0a0b0b,inset 0 0 0 3px #3b3e3c,inset 0 0 10px #000c;opacity:.58}
/* 四角鉚釘（做舊金屬框） */
.slot::before,.slot::after{content:"";position:absolute;inset:4px;pointer-events:none;
 background:radial-gradient(circle at 2px 2px,#a3a6a2 0 1.1px,#0000 1.7px),radial-gradient(circle at calc(100% - 2px) 2px,#a3a6a2 0 1.1px,#0000 1.7px)}
.slot::after{background:radial-gradient(circle at 2px calc(100% - 2px),#a3a6a2 0 1.1px,#0000 1.7px),radial-gradient(circle at calc(100% - 2px) calc(100% - 2px),#a3a6a2 0 1.1px,#0000 1.7px)}
.slot svg{width:84%;height:84%;stroke:#e8e2d4;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px #000c)}
.slot svg image{image-rendering:auto}
.slot.full{opacity:1;cursor:pointer;transition:box-shadow .15s,transform .15s}
.slot.full:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px #c9ccc7,inset 0 0 0 2px #0a0b0b,inset 0 0 0 3px #555856,inset 0 0 10px #000c}
.slot.sel{animation:glow 1.9s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 0 0 1px #f4f2ea,inset 0 0 0 2px #000,inset 0 0 0 3px #b9b6a8,inset 0 0 12px #ffffff1c,0 0 5px #ffffff33}
 50%{box-shadow:inset 0 0 0 1px #fff,inset 0 0 0 2px #000,inset 0 0 0 3px #e7e3d2,inset 0 0 18px #ffffff30,0 0 12px #ffffff66}}
#selname{min-height:2.1em;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;letter-spacing:.16em;color:#f1ede2;padding:4px;background:#0009;box-shadow:inset 0 0 0 1px #4a4d4b}
#selname:empty::before{content:"— 未選取 —";color:#5f625f;letter-spacing:.2em;font-size:11px}
#side .sbs{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:7px;background:#0007;box-shadow:inset 0 0 0 1px #3a3d3b}
/* ===== 【CONTRACT】對話框 #dlgp（參考圖四）：JS 切 .on / .toast；#who #dlog #txt #ch #nx 皆為 JS 目標 ===== */
#dlgp{position:absolute;left:12px;right:12px;bottom:48px;z-index:10;min-height:100px;padding:12px 22px 18px;border-radius:0;cursor:pointer;
 background:rgba(3,3,3,.93);box-shadow:inset 0 0 0 1px #e4e5e1,inset 0 0 0 4px #030303,inset 0 0 0 5px #707370,0 0 0 1px #000,0 10px 30px #000d;
 opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .18s}
#dlgp::before{content:"";position:absolute;inset:5px;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff09 0 1px,#0000 1px 3px),radial-gradient(ellipse at 50% 0%,#ffffff08,#0000 70%)}
#dlgp.on{opacity:1;transform:none;pointer-events:auto}
#dlgp.toast{min-height:0;padding:9px 20px 11px}
#dtop{position:relative;display:flex;justify-content:space-between;align-items:center;min-height:22px}
#who{font-size:12.5px;letter-spacing:.24em;color:#ecebe6;padding:0 8px 0 0}
#who:not(:empty){padding:1px 10px;margin-left:-6px;background:#000;box-shadow:inset 0 0 0 1px #8f928e}
#who.m{color:#f08a7c}#who.p{color:#a9cdf0}#who.s{color:#e8dcc0}
#dlog{border:0;border-radius:0;padding:2px 9px;font-family:var(--pix);font-size:10.5px;letter-spacing:.14em;color:#9a9d99;cursor:pointer;background:#000;box-shadow:inset 0 0 0 1px #4d504e}
#dlog:hover{color:#fff;box-shadow:inset 0 0 0 1px #d4d6d1}
#txt{position:relative;font-size:15.5px;line-height:1.8;min-height:1.8em;color:var(--txt);letter-spacing:.04em;text-shadow:0 0 3px #ffffff26,0 1px 0 #000}
#txt.n{font-style:italic;color:#b5b8b4}
#nx{position:absolute;right:18px;bottom:9px;color:#f1f0eb;font-size:12px;visibility:hidden;animation:blink 1.1s steps(2,end) infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
#ch{position:relative;display:flex;flex-direction:column;gap:7px;margin-top:6px}
#ch button,.btn{border:0;border-radius:0;padding:8px 14px;font-size:14px;color:var(--txt);cursor:pointer;text-align:left;letter-spacing:.04em;
 background:var(--scan),#0c0d0d;box-shadow:inset 0 0 0 1px #6c6f6c,0 0 0 1px #000}
#ch button::before{content:"▸ ";color:#6f726f}
#ch button:hover,.btn:hover{color:#fff;background:var(--scan),#1a1c1b;box-shadow:inset 0 0 0 1px #eceee9,0 0 10px #ffffff1c}
#ch button:hover::before{color:#fff}
/* ===== 【CONTRACT】LOG 視窗 #logw（.on 顯示）/ #lh #lx #ll / .le 每行 ===== */

// 【CONTRACT】全域狀態：busy 演出鎖｜S 劇情旗標（見檔頭第三節）｜inv 背包 id 陣列｜sel 選取中的道具 id

const wait=ms=>new Promise(r=>setTimeout(r,ms));

// 【VISUAL】打字速度＝say() 內 setInterval 的 26ms；toast 持續＝note() 內的 3200ms。
const hist=[];let logOpen=false,dMode=0,dRes=null,dTimer=0,dFull='',toastT=0;
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// rich(t,n)：把 **粗體** 標示轉成 <b class="hl">，n＝只顯示前 n 個字（打字機用）
function rich(t,n){let o='',b=false,c=0;n=n==null?1e9:n;for(let i=0;i<t.length&&c<n;i++){if(t[i]=='*'&&t[i+1]=='*'){o+=b?'</b>':'<b class="hl">';b=!b;i++;continue}o+=esc(t[i]);c++}return o+(b?'</b>':'')}
const plain=t=>String(t).replace(/\*\*/g,'');
function showP(on){$('dlgp').classList.toggle('on',!!on);if(!on)$('dlgp').classList.remove('toast')}
function fin(){clearInterval(dTimer);dTimer=0;$('txt').innerHTML=rich(dFull);dMode=2;$('nx').style.visibility='visible'}
function adv(){if(logOpen)return;if(dMode==1)fin();else if(dMode==2){dMode=0;showP(0);$('nx').style.visibility='hidden';$('txt').textContent='';$('who').textContent='';const r=dRes;dRes=null;if(r)r()}else if(dMode==0)showP(0)}
function hide(){clearInterval(dTimer);clearTimeout(toastT);dMode=0;dRes=null;showP(0);$('ch').innerHTML='';$('txt').textContent='';$('who').textContent='';$('nx').style.visibility='hidden'}
function cls(w){return w=='警衛室'?'m':(w=='你'||w=='玩家')?'p':w=='系統'?'s':''}
// LOG 只記錄角色對話（警衛室／你），旁白、系統、提示一律不記
const isChar=w=>w=='警衛室'||w=='你'||w=='玩家';
function note(t,w){clearTimeout(toastT);if(!t){if(dMode==0)hide();return}
 if(isChar(w))hist.push({w,t,c:cls(w)});
 if(dMode)return;
 $('who').textContent=isChar(w)?w:'';$('who').className=cls(w);$('txt').className=isChar(w)?'':'n';$('txt').innerHTML=rich(t);$('ch').innerHTML='';$('nx').style.visibility='hidden';
 $('dlgp').classList.add('toast','on');toastT=setTimeout(()=>{if(dMode==0)hide()},3200)}
function say(w,t){return new Promise(r=>{clearTimeout(toastT);clearInterval(dTimer);const n=!w||w=='旁白';dMode=1;dRes=r;dFull=t;
 if(isChar(w))hist.push({w,t,c:cls(w)});const sy=w=='系統';
 $('who').textContent=(n||sy)?'':w;$('who').className=cls(w);$('txt').className=n?'n':sy?'sys':'';$('txt').textContent='';$('ch').innerHTML='';$('nx').style.visibility='hidden';
 $('dlgp').classList.remove('toast');showP(1);let i=0;const L=plain(t).length;dTimer=setInterval(()=>{i++;$('txt').innerHTML=rich(t,i);if(i>=L)fin()},26)})}
const M=t=>say('警衛室',t),P=t=>say('你',t),N=t=>say('旁白',t);
function choose(o){return new Promise(r=>{clearTimeout(toastT);clearInterval(dTimer);dMode=3;const c=$('ch');$('who').textContent='';$('txt').textContent='';$('nx').style.visibility='hidden';$('dlgp').classList.remove('toast');showP(1);
 c.innerHTML=o.map((t,i)=>`<button data-i="${i}">${t}</button>`).join('');
 c.onclick=async e=>{const i=e.target.dataset.i;if(i==null)return;c.innerHTML='';c.onclick=null;dMode=0;await P(o[i]);r(+i)}})}
function openLog(){if(logOpen)return;logOpen=true;$('ll').innerHTML=hist.length?hist.map((e,i)=>`<div class="le ${e.c}"><span class="lt0">${String(i+1).padStart(3,'0')}</span><b>${esc(e.w)}</b><span>${rich(e.t)}</span></div>`).join(''):'<div class="le n"><span>（尚無對話紀錄）</span></div>';$('logw').classList.add('on');$('ll').scrollTop=$('ll').scrollHeight}
function closeLog(){if(!logOpen)return;logOpen=false;$('logw').classList.remove('on')}
$('lg').onclick=openLog;$('lx').onclick=closeLog;

$('rst').onclick=e=>{e.stopPropagation();const b=$('rst');if(TITLE||(S&&S.over))return;if(!b.dataset.ok){b.dataset.ok=1;b.textContent='確定重來？';clearTimeout(b._t);b._t=setTimeout(()=>{delete b.dataset.ok;b.textContent='重新遊玩'},2500);return}delete b.dataset.ok;b.textContent='重新遊玩';start(true)};

// 【CONTRACT】背包渲染：重建 #inv 內的 .slot（至少 8 格、偶數）。圖示＝icon(id)：優先用 3D 模型即時拍的縮圖（thumb()，見區塊 B），失敗才退回 IT 第三欄 SVG。改格子外觀請改 CSS 或此處模板，但需保留 class "slot full sel" 與 data-id。
function render(){const n=Math.max(8,inv.length+inv.length%2);let h='';for(let i=0;i<n;i++){const id=inv[i];h+=id?`<div class="slot full ${sel==id?'sel':''}" data-id="${id}" title="${IT[id][0]}"><svg viewBox="0 0 32 32">${icon(id)}</svg></div>`:'<div class="slot"></div>'}$('inv').innerHTML=h;$('selname').textContent=sel?IT[sel][0]:''}
function icon(id){let u='';try{u=thumb(id)}catch(e){}return u?`<image href="${u}" x="0" y="0" width="32" height="32"/>`:IT[id][2]}

// 【CONTRACT】run(async fn)：演出包裝器。期間 busy=true → 3D/背包點擊被忽略；結束自動解鎖。劇情新增事件請都用它包。
function run(f){if(busy)return;busy=true;f().catch(console.error).finally(()=>{busy=false;render()})}

function showTitle(){GID++;busy=true;S={};inv=[];sel=null;hist.length=0;hide();closeLog();closeM();resetView();resetFx();render();

// 開場演出 start()：A-01 ～ A-09。A-06 起解除演出鎖，玩家可邊聽邊探索（若玩家觸發其他事件，開場尾段會被取代）。
async function start(fade){

 if(TITLE||fade){o.style.transition='opacity 1.5s';o.style.background='';o.style.color='';o.innerHTML='';o.className='on';$('title').classList.add('fade');await wait(1500);if(g!=GID)return}   // 畫面慢慢變暗

 busy=true;S={};inv=['key'];sel=null;hist.length=0;codeLock=0;hide();closeLog();resetView();resetFx();closeM();render();
 o.style.transition='';o.style.background='';o.style.color='';o.className='on';o.innerHTML='';
 SFX.play('crash');

 shake(2800,.012);await wait(1000);if(g!=GID)return;                                  // 畫面慢慢震動
 o.style.transition='opacity 1.5s';o.className='';flicker(3000);swayA=.05;await wait(3000);if(g!=GID)return;swayA=0;   // 黑幕淡出＋燈光不規律閃爍 3 秒
 await a1;if(g!=GID)return;
 const a2=N('燈光閃爍了一下，暫時恢復正常照明。恍惚之中，你似乎並不記得爲何會來到這裏。');
 setTimeout(()=>{if(g==GID)lookAround(g)},1000);await a2;                             // 1 秒後鏡頭慢慢左右看
 await N('**對講機**中傳出滋滋的雜音與說話聲……');
 await M('你好，請問你是被困在電梯裡了嗎？喂，聽得到嗎，有沒有受傷？');
 await choose(['我有聽到，你說。','三小……現在是怎樣？！']);if(g!=GID)return;
 busy=false;render();   // 之後開放玩家自由探索互動點
 await M('你不記得了嗎？你剛按緊急按鈕找了**警衛室**求助，我是來幫你的。');
 await M('但是我這邊監視器壞了，沒辦法看到你的狀況。');
 await M('你有試過**按其他樓層的按鈕**嗎？');

 if(dMode==0)hide()}

// 鏡頭緩動：panTo(yaw,pitch,fov,ms)、lookSlow(物件,fov,ms)
function panTo(y,p,f,ms){return new Promise(r=>{const a=[tY,tP,tF],t0=performance.now();(function st(){const k=Math.min(1,(performance.now()-t0)/ms),e=k*k*(3-2*k);tY=a[0]+(y-a[0])*e;tP=a[1]+(p-a[1])*e;tF=a[2]+(f-a[2])*e;if(k<1)requestAnimationFrame(st);else r()})()})}
function lookSlow(o,f,ms){const sv=[tY,tP,tF];look(o,f);const tg=[tY,tP,tF];tY=sv[0];tP=sv[1];tF=sv[2];return panTo(tg[0],tg[1],tg[2],ms)}
